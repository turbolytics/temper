features:
  - id: adapter.go
    description: Lets a Go test state what it proves and records how it ended.
    requires: [unit]
  - id: declarations.load
    description: Reads every declaration into one model, rejecting unknown fields.
    requires: [unit]
  - id: declarations.extension_fields
    description: Ignores x- fields, so a project keeps its own metadata beside Temper's.
    requires: [unit]
  - id: cli.check
    description: Validates declarations without running any test and names each problem's file, id and rule.
    requires: [unit, integration]
  - id: cli.matrix
    description: Joins declarations with evidence and writes the committed statuses and MATRIX.md.
    requires: [unit, integration]
  - id: cli.matrix_json
    description: Prints the full matrix, errors and summary as JSON for CI and agents.
    requires: [integration]
  - id: cli.matrix_check
    description: Writes nothing and exits 3 when committed statuses or MATRIX.md are out of date.
    requires: [unit, integration]
  - id: cli.render
    description: Rewrites MATRIX.md from the committed statuses alone.
    requires: [unit]
  - id: cli.matrix_split
    description: Writes a matrix of more than 500 cells as an index, MATRIX.md, and one page per group of ids under temper/matrix/, and removes pages no group needs.
    requires: [unit, integration]
  - id: cli.run
    description: Runs a command with the level and evidence directory set, so no test chooses its own level.
    requires: [unit, integration]
  - id: cli.clean
    description: Deletes all evidence, the start of a full run.
    requires: [unit]
  - id: cli.guide
    description: Prints the guide an LLM or a person needs to work in a Temper project, matching the installed version.
    requires: [unit, integration]
  - id: cli.version
    description: Prints the name, Temper by Turbolytics, and the version the binary was built as, whether stamped at release or installed with go install.
    requires: [unit, integration]
  - id: site.findings
    description: Holds findings.csv, the public record of what Temper helped find, to its rules, and builds the Temper site from it.
    requires: [unit]
  - id: site.case_studies
    description: Builds the Case Studies pages, audits written up with the project's approval, linked from the top-level nav and from each project's findings.
    requires: [unit]
  - id: site.contact
    description: Builds the Contact page, the consulting offers grouped by who buys them with a call link and email, and points every contact link on the site to it so no visitor leaves the site to reach us.
    requires: [unit]
  - id: cli.scenarios_run
    description: Runs runner-temper scenarios against a Docker Compose topology, injecting named faults on a seeded schedule, and records one verdict per check as evidence.
    requires: [unit, integration]
  - id: declarations.recipe_packs
    description: Includes Temper's recipe packs from temper.yml and the project's named commands from commands.yml, so a scenario names each command once.
    requires: [unit, integration]
  - id: cli.recipes
    description: Lists the built-in recipe packs and prints any one of them.
    requires: [unit, integration]
