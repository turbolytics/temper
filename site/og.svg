    <text x="440" y="235" font-size="34" font-weight="700">Temper <tspan font-weight="400" fill="#a1a5b3">by Turbolytics</tspan></text>
    <text x="440" y="330" font-size="72" font-weight="700">Every promise,</text>
    <text x="440" y="412" font-size="72" font-weight="700">proven.</text>
    <text x="440" y="482" font-size="28" fill="#a1a5b3">Declare what your system must do. Temper fails</text>
    <text x="440" y="520" font-size="28" fill="#a1a5b3">the build when a promise has no proof.</text>
