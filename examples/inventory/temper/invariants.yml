invariants:
  - id: store.reserve.never_negative
    claim: >
      A reservation larger than the stock is refused and leaves the stock
      unchanged; stock never goes below zero.
    applies_to: store
    class: safety
    family: correctness
    requires: [unit]

  - id: store.persists_across_restart
    claim: >
      Stock written before a restart is the stock read after it.
    applies_to: store
    class: safety
    family: durability
    requires: [integration]

  - id: store.reserve.no_oversell_under_concurrency
    claim: >
      Two processes reserving the last units at once never both succeed.
    applies_to: store
    class: safety
    family: correctness
    requires: [integration]
    tracked_by: "#12"

  - id: store.restock.adds_exactly
    claim: >
      Restocking n units of a SKU adds exactly n to its stock, never more
      and never less.
    applies_to: store
    class: safety
    family: correctness
    # The memory store proves this in-process; the file store proves it
    # against a real file, so each subject names the one level that suits it.
    requires_any: [unit, integration]
