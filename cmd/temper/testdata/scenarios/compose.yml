# counter appends a line every 100 ms; reader is a one-shot that reads it.
# http is a Go HTTP counter, http-racy the same without its lock; each
# answers as counter. load is a one-shot that sends increments.
services:
  counter:
    image: busybox:1.36
    command: ["sh", "-c", "while true; do echo x >> /data/count; sleep 0.1; done"]
    volumes: [data:/data]
  reader:
    image: busybox:1.36
    command: ["true"]
    volumes: [data:/data]
  http:
    build: ./httpcounter
    image: temper-fixture-httpcounter
    command: ["/counter", "serve"]
    volumes: [httpdata:/data]
    networks: {default: {aliases: [counter]}}
    healthcheck: &healthy
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8080/healthz"]
      interval: 1s
      retries: 60
  http-racy:
    image: temper-fixture-httpcounter
    pull_policy: never
    command: ["/counter", "serve", "-racy"]
    volumes: [httpdata:/data]
    networks: {default: {aliases: [counter]}}
    healthcheck: *healthy
  load:
    image: temper-fixture-httpcounter
    pull_policy: never
    command: ["true"]
    volumes: [httpdata:/data]
volumes:
  data: {}
  httpdata: {}
