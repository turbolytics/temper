  events:
    - up: {$subject: true}
    - run: [oracle, replay, "{subject}"]
    - check:
        results:
          run: [oracle, check, "{subject}", compat]
          decides: [compat.matches_postgres]
    - check:
        results:
          run: [oracle, check, "{subject}", sql.command]
          decides: [sql.command/*]
    - check:
        results:
          run: [oracle, check, "{subject}", sql.syntax]
          decides: [sql.syntax/*]
    - check:
        results:
          run: [oracle, check, "{subject}", sql.function]
          decides: [sql.function/*]
    - check:
        results:
          run: [oracle, check, "{subject}", sql.operator]
          decides: [sql.operator/*]
    - check:
        results:
          run: [oracle, check, "{subject}", sql.type]
          decides: [sql.type/*]
