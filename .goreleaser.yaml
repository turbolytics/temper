version: 2

project_name: temper

builds:
  - main: ./cmd/temper
    binary: temper
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - SPEC.md

checksum:
  name_template: checksums.txt

changelog:
  use: github
