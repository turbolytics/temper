name: pages

# Builds the Temper by Turbolytics site from findings/findings.csv and
# MATRIX.md, and deploys it to GitHub Pages. In the repository settings,
# Pages > Source must be set to GitHub Actions.

on:
  push:
    branches: [main]
    paths:
      - 'findings/**'
      - 'site/**'
      - 'MATRIX.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# The same permissions as GitHub's starter workflow for Pages. The build job's
# configure-pages step reads the Pages settings, and the deploy job writes.
permissions:
  contents: read
  pages: write
  id-token: write

# Two pushes never deploy at once. A newer push waits for the running deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: test the findings and the site
        run: go test ./findings/... ./site/...
      - name: build the site
        run: go run ./site -out site/_build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/_build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
